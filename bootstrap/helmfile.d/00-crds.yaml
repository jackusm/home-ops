---

# This helmfile extracts and installs Custom Resource Definitions (CRDs)
# from Helm charts. It is not intended to be used with helmfile apply or
# helmfile sync.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

releases:
  - name: cloudflare-dns
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.23.0

  - name: envoy-gateway
    namespace: network
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    version: v1.10.0

# kube-prometheus-stack deliberately absent: its CRDs ship in the chart's
# crds subchart and upgrade with the release (chart default crds.enabled: true)
