---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-secret
spec:
  data:
    - remoteRef:
        key: OPENVPN_USER
      secretKey: OPENVPN_USER
    - remoteRef:
        key: OPENVPN_PASSWORD
      secretKey: OPENVPN_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: gluetun-secret
