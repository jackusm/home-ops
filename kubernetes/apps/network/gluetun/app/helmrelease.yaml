---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun
spec:
  chartRef:
    kind: OCIRepository
    name: gluetun
  interval: 1h
  values:
    controllers:
      gluetun:
        strategy: RollingUpdate
        rollingUpdate:
          surge: 0
          unavailable: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.1
            env:
              TZ: Europe/London
              VPN_SERVICE_PROVIDER: protonvpn
              FREE_ONLY: yes # gluetun's viper parser accepts yes/no AND on/off
              SERVER_COUNTRIES: "Netherlands,Norway,Poland,Romania,Switzerland"
              # --- HTTP proxy: the thing other pods dial ---
              HTTPPROXY: "on"
              HTTPPROXY_LISTENING_ADDRESS: ":8888"
              # CRITICAL: gluetun's firewall drops ALL inbound on eth0 by
              # default. Without whitelisting 8888, the kubelet's probes AND
              # tg-s3-processor's HTTP_PROXY traffic both get silently
              # blackholed (i/o timeout, not connection refused). The gluetun
              # wiki explicitly notes FIREWALL_INPUT_PORTS is "needed for
              # Kubernetes sidecars". This whitelist is load-bearing for the
              # entire use case, not just the probes.
              FIREWALL_INPUT_PORTS: "8888"
            envFrom:
              - secretRef:
                  name: gluetun-secret # OPENVPN_USER, OPENVPN_PASSWORD
            probes:
              # startupProbe gives the slow OpenVPN boot (~30-90s) a wide
              # window WITHOUT liveness killing it. Until startup passes,
              # liveness/readiness don't run at all. 30 failures x 10s = 5 min.
              # NOTE: gluetun binds 8888 at STARTUP, before the tunnel is fully
              # up, so TCP-8888-open means "proxy listener ready" rather than
              # strictly "VPN established". gluetun self-heals the tunnel via
              # its own internal healthcheck regardless.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &proxyport 8888
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *proxyport
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *proxyport
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            # gluetun needs NET_ADMIN to build the tunnel + iptables rules and
            # runs as root, so this container is the deliberate exception to the
            # repo's runAsNonRoot:65534 / drop-ALL norm. Do NOT add
            # readOnlyRootFilesystem: gluetun writes to /gluetun and /tmp.
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              # 512Mi: gluetun spikes at boot writing /gluetun/servers.json
              # with ~20,901 hardcoded servers + DNS-over-TLS cache. 256Mi
              # got OOMKilled (exit 137) reproducibly during that load.
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
    # ClusterIP Service (default type) == the k8s equivalent of compose's
    # `127.0.0.1:8888:8888`: reachable from inside the cluster only, NOT from
    # the host/LAN/internet. Other pods dial http://gluetun.network.svc.cluster.local:8888
    service:
      app:
        ports:
          httpproxy:
            port: *proxyport
