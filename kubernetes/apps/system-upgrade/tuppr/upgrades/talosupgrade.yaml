---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.14.4
  policy:
    rebootMode: powercycle
    # Two nodes, one of them the control plane: draining leaves nowhere for the
    # evicted pods to go, and with the node cordoned the upgrade job can never
    # see it Ready again -> the upgrade never finishes and the node is never
    # uncordoned. Take the downtime instead of deadlocking.
    nodrain: true
