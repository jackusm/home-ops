---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: true
    # Chart renders no replicas; postRenderer makes git own the field
    postRenderer:
      kustomize:
        patches:
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: flux-operator
              spec:
                replicas: 1
                template:
                  spec:
                    priorityClassName: system-cluster-critical
