---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      # renovate: datasource=helm depName=longhorn registryUrl=https://charts.longhorn.io/
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 15m
  values:
    persistence:
      # SCs are shipped explicitly in storageclass.yaml
      defaultClass: false
    defaultSettings:
      # replica data on the node's ephemeral storage via the user-volume bind
      # mount (talos/patches/global/machine-longhorn.yaml); /var/lib/longhorn is
      # not used on Talos 1.14+ (extraMounts removed upstream)
      defaultDataPath: /var/mnt/longhorn
      # no over-provisioning: replica capacity must fit the smallest node disk
      storageOverProvisioningPercentage: 100
      # stop scheduling replicas before kubelet eviction thresholds
      storageMinimalAvailablePercentage: 15
      orphanResourceAutoDeletion: replica-data
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      autoCleanupSystemGeneratedSnapshot: true
      v1DataEngine: true
    defaultBackupStore:
      # bucket + region from longhorn-backup-vars; endpoint + keys flow into
      # longhorn-backup-secret from the same file
      backupTarget: s3://${S3_BUCKET}@${S3_REGION}/
      backupTargetCredentialSecret: longhorn-backup-secret
