---
# S3 identity consumed by the longhorn deployment (helmrelease values
# default-settings backup credentials)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-secret
spec:
  data:
    - remoteRef:
        key: longhorn-s3-access-key-id
      secretKey: AWS_ACCESS_KEY_ID
    - remoteRef:
        key: longhorn-s3-secret-access-key
      secretKey: AWS_SECRET_ACCESS_KEY
    - remoteRef:
        key: longhorn-s3-endpoint
      secretKey: AWS_ENDPOINTS
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: longhorn-backup-secret
