---
# substituteFrom source for longhorn/ks.yaml; group level so it reconciles independently of the app build
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-vars
spec:
  data:
    - {remoteRef: {key: longhorn-s3-bucket}, secretKey: S3_BUCKET}
    - {remoteRef: {key: longhorn-s3-region}, secretKey: S3_REGION}
    - {remoteRef: {key: longhorn-s3-endpoint}, secretKey: S3_ENDPOINT}
    - {remoteRef: {key: longhorn-s3-access-key-id}, secretKey: S3_ACCESS_KEY_ID}
    - {remoteRef: {key: longhorn-s3-secret-access-key}, secretKey: S3_SECRET_ACCESS_KEY}
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: longhorn-backup-vars
