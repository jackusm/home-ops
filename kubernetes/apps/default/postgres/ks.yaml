---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: plugin-barman-cloud
      namespace: database
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./kubernetes/apps/default/postgres/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: true
  retryInterval: 2m
  postBuild:
    substituteFrom:
      - kind: Secret
        name: postgres-backup-vars
      # SOURCE_DB_HOST/PASSWORD for the one-shot teldrive import at bootstrap
      - kind: Secret
        name: teldrive-source-superuser
