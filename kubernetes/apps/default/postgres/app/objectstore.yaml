---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-main-barman
spec:
  configuration:
    destinationPath: s3://${S3_BUCKET}/main/
    endpointURL: ${S3_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: postgres-backup-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backup-secret
        key: SECRET_ACCESS_KEY
    wal:
      compression: zstd
      maxParallel: 2
    data:
      compression: gzip
  retentionPolicy: 14d
