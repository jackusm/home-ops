---
# plaintext template: every value is substituted from backup-vars.sops.yaml
# one directory up; nothing sensitive lives in this file
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-secret
stringData:
  ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
---
# import-time credential for the compose teldrive source; consumed once at
# bootstrap, value substituted from teldrive-db-vars (one directory up)
apiVersion: v1
kind: Secret
metadata:
  name: teldrive-source-superuser
stringData:
  password: ${SOURCE_DB_PASSWORD}
