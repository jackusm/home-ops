---
# substituteFrom source for postgres/ks.yaml; group level so it reconciles independently of the app build
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-vars
spec:
  data:
    - remoteRef:
        key: postgres-s3-bucket
      secretKey: S3_BUCKET
    - remoteRef:
        key: postgres-s3-endpoint
      secretKey: S3_ENDPOINT
    - remoteRef:
        key: postgres-s3-access-key-id
      secretKey: S3_ACCESS_KEY_ID
    - remoteRef:
        key: postgres-s3-secret-access-key
      secretKey: S3_SECRET_ACCESS_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: postgres-backup-vars
---
# substituteFrom source for cluster.yaml ${SOURCE_DB_HOST}; also the CNPG
# import password ref (externalClusters[0].passwordSecretRef). Renames the
# BWS values into the placeholder spelling and the ref's `password` key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teldrive-source-superuser
spec:
  data:
    - remoteRef:
        key: teldrive-db-host
      secretKey: SOURCE_DB_HOST
    - remoteRef:
        key: teldrive-db-password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: teldrive-source-superuser
