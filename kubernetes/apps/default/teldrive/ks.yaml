---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teldrive
spec:
  dependsOn:
    - name: postgres
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/teldrive/app
  # Needed because app/httproute.yaml carries ${SECRET_DOMAIN}. Only
  # cluster-secrets here: it is seeded by the root cluster-apps build,
  # unlike app-owned secrets which must never be a substituteFrom source.
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
