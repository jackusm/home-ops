---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teldrive
spec:
  dependsOn:
    - name: postgres
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/teldrive/app
  # No postBuild.substituteFrom: the build has no ${...} placeholders. The
  # secret reaches the container via envFrom/valueFrom, which flux resolves
  # at apply time, not build time.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
