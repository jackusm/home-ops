---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Decrypted in-place by this Kustomization (sops decryption is patched
  # onto every child Kustomization by the root cluster-apps ks) and read
  # by the container via envFrom — no text substitution involved.
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ocirepository.yaml
