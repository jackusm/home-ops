---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teldrive-secrets
spec:
  data:
    - remoteRef:
        key: TELDRIVE_TELEGRAM_APP_ID
      secretKey: TELDRIVE_TELEGRAM_APP_ID
    - remoteRef:
        key: TELDRIVE_TELEGRAM_APP_HASH
      secretKey: TELDRIVE_TELEGRAM_APP_HASH
    - remoteRef:
        key: TELDRIVE_ENCRYPTION_KEYS
      secretKey: TELDRIVE_ENCRYPTION_KEYS
    - remoteRef:
        key: TELDRIVE_SECURITY_SIGNING_KEY
      secretKey: TELDRIVE_SECURITY_SIGNING_KEY
    - remoteRef:
        key: TELDRIVE_SECURITY_DATA_KEY
      secretKey: TELDRIVE_SECURITY_DATA_KEY
    - remoteRef:
        key: TELDRIVE_SECURITY_ALLOWED_USERS
      secretKey: TELDRIVE_SECURITY_ALLOWED_USERS
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: teldrive-secrets
