---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: teldrive
spec:
  hostnames: ["teldrive.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: teldrive
          port: 8080
      # Envoy Gateway defaults to a 15s request timeout; downloads, uploads
      # and SSE progress streams are long-lived (teldrive's own read/write
      # timeouts are 1h — its reverse-proxy docs prescribe 3600s).
      timeouts:
        request: 1h
