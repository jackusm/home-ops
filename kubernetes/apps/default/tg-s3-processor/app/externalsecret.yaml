---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tg-s3-processor-secret
spec:
  data:
    - remoteRef:
        key: PROCESSOR_AUTH_SECRET
      secretKey: PROCESSOR_AUTH_SECRET
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: tg-s3-processor-secret
