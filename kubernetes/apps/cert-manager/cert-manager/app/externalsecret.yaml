---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager-secret
spec:
  data:
    - remoteRef:
        key: cert-manager
      secretKey: api-token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: cert-manager-secret
