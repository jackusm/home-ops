---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-backend
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://vault.bitwarden.eu/api
      auth:
        secretRef:
          credentials:
            key: access-token
            name: bw-auth-token
            # ClusterSecretStore is cluster-scoped; auth secret needs an explicit ns
            namespace: external-secrets
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        key: ca.crt
        name: bitwarden-ca
        namespace: cert-manager
        type: Secret
      identityURL: https://vault.bitwarden.eu/identity
      organizationID: 5748fb81-0e2b-451a-b8b0-b509012147c5
      projectID: 4cf619b0-7173-429f-9bd0-b5090128c961
