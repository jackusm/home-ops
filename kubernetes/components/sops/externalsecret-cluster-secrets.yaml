---
# replaces the old cluster-secrets.sops.yaml as the component payload:
# materializes Secret cluster-secrets in every group namespace that
# includes this component, so per-app ks.yaml substituteFrom keeps working
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
spec:
  data:
    - remoteRef:
        key: cluster-secrets
      secretKey: SECRET_DOMAIN
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: cluster-secrets
