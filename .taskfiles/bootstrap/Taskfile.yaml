---
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster
    dir: '{{.TALOS_DIR}}'
    cmds:
      - cmd: |
          [ -f talsecret.sops.yaml ] || {
            talosctl gen secrets -o talsecret.yaml
            sops --filename-override talos/talsecret.sops.yaml --encrypt talsecret.yaml > talsecret.sops.yaml
            rm -f talsecret.yaml
          }
      - talstomize build . -o clusterconfig
      - talstomize apply -f . -- --insecure
      - until talosctl bootstrap --nodes {{.CP_IP}}; do sleep 10; done
      - until talosctl kubeconfig {{.ROOT_DIR}} --force --nodes {{.CP_IP}}; do sleep 10; done
    vars:
      CP_IP:
        sh: yq '.nodes | to_entries() | .[] | select(.value.kind == "controlplane") | .value.ip' {{.TALOS_DIR}}/talstomize.yaml | head -1
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/talstomize.yaml
      - which talstomize talosctl sops yq

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}
