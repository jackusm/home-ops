machine:
  network:
    kubespan:
      enabled: true
      advertiseKubernetesNetworks: true
---
# Custom nameservers (Talos v1.14 moved machine.network.nameservers and
# machine.network.disableSearchDomain into the ResolverConfig document)
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
    - address: 1.1.1.1
    - address: 1.0.0.1
searchDomains:
    disableDefault: true
